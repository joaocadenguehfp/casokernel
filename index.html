<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>Caso Kernel · Arquivo de Álgebra Linear</title>
<!-- fontes locais (subconjunto latino, OFL): sem CSS externo bloqueando a primeira pintura -->
<link rel="preload" href="fonts/rajdhani-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Sprite de ícones (traço fino, herdam a cor do texto via currentColor) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3H7l3-3-1-6z"/><path d="M12 12v9"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.7.6 1 1.2 1 2.1h5c0-.9.3-1.5 1-2.1A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></symbol>
  <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-5 14v3h10v-3a8 8 0 0 0-5-14z"/><circle cx="9" cy="11.5" r="1.6"/><circle cx="15" cy="11.5" r="1.6"/><path d="M12 14v2M10 20v-2M14 20v-2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M8 20a3 3 0 0 1-3-3"/></symbol>
</svg>

<header>
  <h1><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg>Caso Kernel</h1>
  <div class="hpbox">
    <span class="lbl"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg><span class="t">Vida</span></span>
    <div class="hp" id="hp" role="meter" aria-label="Vida do detetive" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div class="hpf" id="hpf"></div><span class="hpt" id="hpt">100/100</span>
    </div>
  </div>
  <span class="tag" id="tm-box" title="Tempo de investigação"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span id="tm" role="timer" aria-label="Tempo decorrido">00:00</span></span>
  <span class="tag" id="sc" aria-live="polite"><svg class="ic" aria-hidden="true"><use href="#i-medal"/></svg>0 pts</span>
  <button class="btn sm" id="snd" aria-label="Ativar ou desativar o áudio"><svg class="ic" aria-hidden="true"><use href="#i-sound"/></svg><span class="t">Áudio</span></button>
  <button class="btn sm" id="rs" aria-label="Reiniciar a investigação"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg><span class="t">Reiniciar</span></button>
</header>

<main>
  <section class="folder" id="folder" data-label="Caso nº 0417">
    <div class="sheet">
      <div class="prog" id="pb" role="progressbar" aria-label="Progresso do caso" aria-valuemin="0" aria-valuemax="100"><div id="pf"></div></div>
      <div id="game" aria-live="polite"></div>
    </div>
  </section>
  <aside class="invw">
    <div class="inv">
      <h3><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg>Inventário de pistas</h3>
      <ul id="inv"></ul>
    </div>
  </aside>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt">
  <div class="sheet pop">
    <h2 id="ovt"><svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg>Caso encerrado</h2>
    <p id="ovp"></p>
    <button class="btn stamp" id="ovb"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>Arquivar caso</button>
  </div>
</div>

<div class="ov" id="pz" role="dialog" aria-modal="true" aria-label="Problema de investigação">
  <div class="sheet pzp" id="pzp" tabindex="-1"><div id="pzb"></div></div>
</div>

<div class="ov" id="fc" role="dialog" aria-modal="true" aria-label="Dossiê de aprendizado">
  <div class="notebook">
    <div id="fcb"></div>
    <button class="btn stamp" id="fcn"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>Próxima fase</button>
  </div>
</div>

<noscript><p style="position:relative;z-index:2;padding:20px;color:#e8e4d8;font-family:sans-serif">Este jogo precisa de JavaScript ativado.</p></noscript>
<script src="cases.js"></script>
<script src="scenes.js"></script>
<script src="tools2d.js"></script>
<script src="tools3d.js"></script>
<script src="script.js"></script>
</body>
</html>
