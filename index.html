<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caso Kernel · Arquivo de Álgebra Linear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🕵️‍♂️ Caso Kernel</h1>
  <div class="hpbox">
    <span class="lbl">🩸 Vida</span>
    <div class="hp" id="hp" role="meter" aria-label="Vida do detetive" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div class="hpf" id="hpf"></div><span class="hpt" id="hpt">100/100</span>
    </div>
  </div>
  <span class="tag" id="sc" aria-live="polite">🏅 0 pts</span>
  <button class="btn sm" id="snd" aria-label="Ativar ou desativar o áudio">🔊 Áudio</button>
  <button class="btn sm" id="rs" aria-label="Reiniciar a investigação">↺ Reiniciar</button>
</header>

<main>
  <section class="folder" id="folder" data-label="📂 Caso nº 0417">
    <div class="sheet">
      <div class="prog" id="pb" role="progressbar" aria-label="Progresso do caso" aria-valuemin="0" aria-valuemax="100"><div id="pf"></div></div>
      <div id="game" aria-live="polite"></div>
    </div>
  </section>
  <aside class="inv">
    <h3>📜 Inventário de pistas</h3>
    <ul id="inv"></ul>
  </aside>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt">
  <div class="sheet pop">
    <h2 id="ovt">🏆 Caso encerrado</h2>
    <p id="ovp"></p>
    <button class="btn stamp" id="ovb">✅ Arquivar caso</button>
  </div>
</div>

<script src="cases.js"></script>
<script src="script.js"></script>
</body>
</html>
