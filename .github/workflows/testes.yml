name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Validar casos, cenas e respostas
        run: npm run validate
      - name: Teste de fumaça (desktop)
        run: npm run smoke
      - name: Teste de fumaça (celular)
        run: npm run smoke:mobile
